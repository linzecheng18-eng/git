<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 图片审美评测助手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>AI 图片审美评测助手</h1>
      <p>上传一张图片，获取五维评分与修改建议。</p>
    </section>
    <section class="panel">
      <input id="fileInput" type="file" accept="image/*">
      <button id="analyzeBtn">开始分析</button>
      <p id="status"></p>
      <div id="result"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
