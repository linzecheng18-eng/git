<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 图片审美评测助手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">给普通创作者的图片反馈</p>
      <h1>AI 图片审美评测助手</h1>
      <p>上传一张图片，获取五维评分与可直接执行的修改建议。</p>
    </header>

    <section class="panel" aria-labelledby="uploadTitle">
      <h2 id="uploadTitle">上传图片</h2>
      <fieldset id="imageTypeGroup">
        <legend>这是什么类型的图片？</legend>
        <div class="type-options">
          <label><input type="radio" name="imageType" value="photography"> 摄影照片</label>
          <label><input type="radio" name="imageType" value="ai_generated"> AI 生成图</label>
          <label><input type="radio" name="imageType" value="social_media"> 社交媒体配图</label>
        </div>
      </fieldset>

      <label class="upload-box" for="fileInput">
        <span>选择一张 JPG、PNG 或 WebP 图片</span>
        <small>文件大小不超过 10 MiB</small>
      </label>
      <input class="visually-hidden" id="fileInput" type="file" accept="image/jpeg,image/png,image/webp">
      <img id="preview" alt="待评测图片预览" hidden>
      <button id="analyzeBtn" type="button">开始评测</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="result" hidden>
      <h2>评测结果</h2>
      <section aria-labelledby="summaryTitle">
        <h3 id="summaryTitle">总结</h3>
        <p id="summary"></p>
      </section>
      <section aria-labelledby="diagnosisTitle">
        <h3 id="diagnosisTitle">问题与对应建议</h3>
        <div id="diagnosis" class="diagnosis"></div>
      </section>
      <section aria-labelledby="scoresTitle">
        <h3 id="scoresTitle">五维评分</h3>
        <div id="scores" class="scores"></div>
      </section>
      <button id="resetBtn" class="secondary" type="button">评测另一张</button>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
